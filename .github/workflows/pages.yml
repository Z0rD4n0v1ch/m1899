# Сайт игры на GitHub Pages — собирается сам из этого репозитория.
# Страница — папка site/, игра — miner-1899.html (кладётся в play/).
# Публикуется при выпуске версии: когда в main приходит коммит, на котором стоит тег vX.Y.Z
# (так делает `./sync.sh release`). Обычные отправки сайт не трогают.
# Вручную — в любой момент: Actions → «Сайт» → Run workflow.
# Адрес: https://z0rd4n0v1ch.github.io/m1899/  ·  игра: …/m1899/play/
name: Сайт

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Это выпуск версии?
        id: check
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          for i in 1 2 3 4 5 6; do
            git fetch -q --tags --force origin || true
            TAG="$(git tag --points-at HEAD | grep -E '^v[0-9]' | tail -1 || true)"
            [ -n "$TAG" ] && break
            sleep 10
          done
          if [ -n "$TAG" ]; then echo "Выпуск $TAG — публикую сайт"; echo "go=1" >> "$GITHUB_OUTPUT"
          else echo "Обычная отправка, не выпуск — сайт не трогаю"; echo "go=0" >> "$GITHUB_OUTPUT"; fi

      - name: Собрать сайт
        if: steps.check.outputs.go == '1'
        run: |
          mkdir -p _site/play
          cp -r site/. _site/
          cp miner-1899.html _site/play/index.html
          touch _site/.nojekyll
          echo "Версия на сайте: $(grep -o "GAME_VERSION = '[0-9.]*'" miner-1899.html)"

      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.go == '1'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.go == '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
